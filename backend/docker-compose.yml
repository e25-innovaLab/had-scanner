
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: accessibility-backend
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    environment:
      DATABASE_URL: postgresql+psycopg://accessibility_user:accessibility_password@db:5432/accessibility_db
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    container_name: accessibility-db
    environment:
      POSTGRES_USER: accessibility_user
      POSTGRES_PASSWORD: accessibility_password
      POSTGRES_DB: accessibility_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accessibility_user -d accessibility_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
